    <title>Specialguiden – anpassad undervisning för anpassad grundskola | Norvay</title>
    <meta name="description" content="Specialguiden från Norvay: planering och anpassningar för anpassad grundskolans högstadium, för elever med intellektuell funktionsnedsättning, kopplat till Lgrsär22." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f5f3ec' stroke='%23123f37' stroke-width='1.5'/%3E%3Ctext x='16' y='21' font-family='Georgia,serif' font-size='15' text-anchor='middle' fill='%23123f37'%3EN%3C/text%3E%3C/svg%3E" />
    <script>
      /* Nattläge, samma som på Norvay: sätts innan sidan ritas. Utan sparat val följer sidan enhetens inställning.
         Valet sparas i kakan "norvay-tema" (bara light eller dark) för hela norvayapp.se. */
      (function(){var t,m=document.cookie.match(/(?:^|; )norvay-tema=(light|dark)/);if(m)t=m[1];if(!t){try{t=localStorage.getItem('norvay-tema')}catch(e){}}if(t!=='dark'&&t!=='light'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();
    </script>
      <!-- Specialguiden -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="2e81b730-fb1d-4183-9323-de51c8949318" data-tag="specialguiden" data-do-not-track="true"></script>
    <style>
      /* Lokala typsnitt (inga externa anrop) */
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 500; font-display: swap; src: url("/fonts/dm-sans-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 600; font-display: swap; src: url("/fonts/dm-sans-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Newsreader"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/newsreader-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Newsreader"; font-style: italic; font-weight: 400; font-display: swap; src: url("/fonts/newsreader-latin-400-italic.woff2") format("woff2"); }
      /* NORVAY_TEMA_SG ===== Norvay-tema (samma som kuratorn-allman/src/theme.css), kategori skola ===== */
      :root {
        --n-bg: #f5f3ec;
        --n-surface: #ffffff;
        --n-ink: #123f37;
        --n-ink-soft: #4f6b63;
        --n-line: rgba(18, 63, 55, 0.14);
        --n-terracotta: #c9785f;
        --n-terracotta-soft: #dd9479;
        --n-radius: 20px;
        --n-radius-sm: 12px;
        --n-font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
        --n-font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --n-accent: #2f6b5a;
        --n-tint: #d7e2d7;
        --n-on-accent: #ffffff;
        --sg-font: var(--n-font-body);   /* brödtext (förut Georgia) */
        --sg-sida: var(--n-bg);          /* sidans bakgrund (förut grön toning) */
      }
      [data-kategori="skola"] { --n-accent: #2f6b5a; --n-tint: #d7e2d7; }
      body { margin: 0; background: var(--n-bg); color: var(--n-ink); font-family: var(--n-font-body); }
      /* Rubriker i Newsreader (gäller alla vyer) */
      #root h1, #root h2, #root h3 { font-family: var(--n-font-display) !important; font-weight: 400 !important; letter-spacing: -0.01em; }
      #root h1 em { font-style: italic; color: #a4533c; } /* mörkare terrakotta – kontrast mot ljus bakgrund */
      /* Startsidans sidhuvud: layout "split" med formen "quarter" */
      .sg-hero { display: grid; grid-template-columns: 1fr 120px; gap: 20px; align-items: center; text-align: left; margin-bottom: 1.2rem; }
      .n-motif { position: relative; width: 100%; aspect-ratio: 1; }
      .n-motif::before, .n-motif::after { content: ""; position: absolute; }
      .n-motif--quarter::before { inset: 10% 0 0 10%; background: var(--n-tint); border-radius: 100% 0 0 0; }
      .n-motif--quarter::after  { width: 22%; aspect-ratio: 1; background: var(--n-accent); border-radius: 50%; left: 6%; top: 6%; }
      @media (max-width: 420px) { .sg-hero { grid-template-columns: 1fr 84px; } }
      :focus-visible { outline: 3px solid var(--n-accent); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
      /* ===== Appens färger (ändra här) – kopplade till Norvay-temat (skola) ===== */
      :root {
        --sg-vit: #ffffff; /* vit (kort, text på färg) */
        --sg-text: var(--n-ink); /* huvudtext */
        --sg-text-2: var(--n-ink); /* text i listor */

        --sg-gron-kant: #b9cbb9; /* grön kantlinje */
        --sg-gron-ljus: var(--n-tint); /* ljusgrön */
        --sg-gron-yta: #e6ede5; /* ljusgrön yta */
        --sg-gron-yta-2: var(--n-bg); /* ljusgrön yta 2 */
        --sg-gron-yta-3: #fbfaf6; /* nästan vit yta */
        --sg-turkos-yta: var(--n-bg); /* turkos yta */

        --sg-bla-mork: #1d463c; /* mörkblå */
        --sg-bla-text: var(--n-ink); /* blå text */
        --sg-bla-yta: #e6ede5; /* blå yta */
        --sg-indigo: #5a4c78; /* indigo (Stöd) */

        --sg-lila-yta: #eeebf3; /* lila yta */
        --sg-lila-yta-2: #f3f0f7; /* lila yta 2 */
        --sg-gra: #4f6b63; /* grå */
        --sg-gra-2: #5d7870; /* grå 2 */
        /* Chattläget: mörkt, i samma gröna toner som Norvays mörka läge */
        --sg-chatt-bg-1: #0f2a24; /* chatt: bakgrund 1 */
        --sg-chatt-bg-2: #133029; /* chatt: bakgrund 2 */
        --sg-chatt-bg-3: #163731; /* chatt: bakgrund 3 */
        --sg-chatt-accent: #8fc2a8; /* chatt: grön accent */
        --sg-chatt-gron: #5e9c84; /* chatt: grön */
        --sg-chatt-text: #e2ded2; /* chatt: text */
        --sg-chatt-text-ljus: #ece7da; /* chatt: ljus text */
        --sg-chatt-text-2: #c9d6cc; /* chatt: text 2 */
        --sg-chatt-dampad: #a9bdb5; /* chatt: dämpad */
        --sg-chatt-dampad-2: #a9bdb5; /* chatt: dämpad 2 */
        --sg-chatt-dampad-3: #a9bdb5; /* chatt: dämpad 3 */

        --sg-chatt-dampad-7: #8ea79e; /* chatt: dämpad 7 */
        --sg-chattgron-a10: rgba(143,194,168,0.1);
        --sg-chattgron-a12: rgba(143,194,168,0.12);
        --sg-chattgron-a15: rgba(143,194,168,0.15);
        --sg-chattgron-a20: rgba(143,194,168,0.2);
        --sg-chattgron-a25: rgba(143,194,168,0.25);
        --sg-chattgron-a30: rgba(143,194,168,0.3);
        --sg-chattgron-a40: rgba(143,194,168,0.4);
        --sg-chattgron-a50: rgba(143,194,168,0.5);
        --sg-chattgron-a60: rgba(143,194,168,0.6);
        --sg-gron-a07: rgba(47,107,90,.07);
        --sg-gron-a08: rgba(47,107,90,0.08);
        --sg-gron-a10: rgba(47,107,90,0.1);
        --sg-gron-a15: rgba(47,107,90,0.15);
        --sg-gronmork-a08: rgba(18,63,55,0.06);
        --sg-gronmork-a25: rgba(18,63,55,0.18);
        --sg-svart-a30: rgba(0,0,0,0.3);
        --sg-svart-a40: rgba(0,0,0,0.4);
        --sg-vit-a02: rgba(255,255,255,0.02);
        --sg-vit-a03: rgba(255,255,255,0.03);
        --sg-vit-a04: rgba(255,255,255,0.04);
        --sg-vit-a05: rgba(255,255,255,0.05);
        --sg-vit-a06: rgba(255,255,255,0.06);
        --sg-vit-a07: rgba(255,255,255,0.07);
        --sg-vit-a08: rgba(255,255,255,0.08);
        --sg-vit-a10: rgba(255,255,255,0.1);
        --sg-vit-a12: rgba(255,255,255,0.12);
        --sg-vit-a13: rgba(255,255,255,0.13);
        --sg-vit-a15: rgba(255,255,255,0.15);
        --sg-vit-a18: rgba(255,255,255,0.18);
        --sg-vit-a22: rgba(255,255,255,0.22);
        --sg-kort: var(--sg-vit); /* kortens bakgrund (vit i ljust läge) */
        --sg-niva-andel: 100%;    /* nivåfärgernas styrka som text (100 % = exakt färgen) */
        /* Textvarianter av fyllnadsfärgerna: samma färg i ljust läge, ljusare i mörkt läge */
        --sg-t-gron: var(--sg-gron); --sg-t-gron-mork: var(--sg-gron-mork); --sg-t-gron-kant: var(--sg-gron-kant);
        --sg-t-bla: var(--sg-bla); --sg-t-lila: var(--sg-lila); --sg-t-lila-mork: var(--sg-lila-mork); --sg-t-lila-ljus: var(--sg-lila-ljus);
        --sg-t-indigo: var(--sg-indigo); --sg-t-gra: var(--sg-gra); --sg-t-gra-2: var(--sg-gra-2);
      }
      /* ===== Chattläget i ljust läge (följer ljust/mörkt som resten av appen) ===== */
      .sg-chatt {
        --sg-chatt-bg-1: #f5f3ec; --sg-chatt-bg-2: #f5f3ec; --sg-chatt-bg-3: #f5f3ec;
        --sg-chatt-accent: #2f6b5a; --sg-chatt-gron: #2f6b5a;
        --sg-chatt-text: #123f37; --sg-chatt-text-ljus: #123f37; --sg-chatt-text-2: #2f4d46;

        --sg-chattgron-a20: rgba(47,107,90,0.2); --sg-chattgron-a25: rgba(47,107,90,0.25); --sg-chattgron-a30: rgba(47,107,90,0.3);
        --sg-chattgron-a40: rgba(47,107,90,0.4); --sg-chattgron-a50: rgba(47,107,90,0.5); --sg-chattgron-a60: rgba(47,107,90,0.6);
        --sg-vit-a02: #ffffff; --sg-vit-a03: #ffffff; --sg-vit-a04: #ffffff; --sg-vit-a05: #ffffff;
        --sg-vit-a06: #ffffff; --sg-vit-a07: #ffffff; --sg-vit-a08: #ffffff;
        --sg-vit-a10: rgba(18,63,55,0.14); --sg-vit-a12: rgba(18,63,55,0.14); --sg-vit-a13: rgba(18,63,55,0.18); --sg-vit-a15: rgba(18,63,55,0.18);
        --sg-svart-a30: rgba(18,63,55,0.06); --sg-svart-a40: rgba(18,63,55,0.08);
        --sg-gron-ljus: #123f37; /* text i elevens egna meddelanden */
      }
      /* ===== Nattläge (samma grundfärger som Norvays mörka läge) ===== */
      :root[data-theme="dark"] {
        color-scheme: dark;
        --n-bg: #0f2a24; --n-surface: #163731; --n-ink: #ece7da; --n-ink-soft: #a9bdb5; --n-line: rgba(236,231,218,0.14);
        --n-terracotta: #e3a58f; --n-terracotta-soft: #d08a72; --n-tint: #1f4239; --n-accent: #8fc2a8;
        /* Ytor, kanter och fyllnad */
        --sg-kort: #163731;
        --sg-gron: #2f6b5a; --sg-gron-mork: #24564a; --sg-gron-kant: #33584e; --sg-gron-ljus: #24493f;
        --sg-gron-yta: #1c3d35; --sg-gron-yta-2: #12302a; --sg-gron-yta-3: #183b34; --sg-turkos-yta: #0f2a24;
        --sg-bla: #2f6b5a; --sg-bla-mork: #1d463c; --sg-bla-yta: #1c3d35;
        --sg-lila-ljus: #4a4160; --sg-lila-yta: #2f2b3f; --sg-lila-yta-2: #2f2b3f;
        /* Text */
        --sg-text: #ece7da; --sg-text-2: #ece7da; --sg-text-dampad: #a9bdb5; --sg-bla-text: #ece7da;
        --sg-t-gron: #8fc2a8; --sg-t-gron-mork: #a8d1bb; --sg-t-gron-kant: #a3b9b0; --sg-t-bla: #8fc2a8;
        --sg-t-lila: #c3b6e0; --sg-t-lila-mork: #c3b6e0; --sg-t-lila-ljus: #c3b6e0; --sg-t-indigo: #c3b6e0;
        --sg-t-gra: #b9c7cc; --sg-t-gra-2: #b9c7cc;
        --sg-niva-andel: 35%;

        --sg-gronmork-a08: rgba(0,0,0,.2); --sg-gronmork-a25: rgba(0,0,0,.35);
      }

        --sg-chatt-bg-1: #0f2a24; --sg-chatt-bg-2: #133029; --sg-chatt-bg-3: #163731;
        --sg-chatt-accent: #8fc2a8; --sg-chatt-gron: #5e9c84;
        --sg-chatt-text: #e2ded2; --sg-chatt-text-ljus: #ece7da; --sg-chatt-text-2: #c9d6cc;
        --sg-chatt-dampad: #a9bdb5; --sg-chatt-dampad-2: #a9bdb5; --sg-chatt-dampad-3: #a9bdb5; --sg-chatt-dampad-4: #a9bdb5;
        --sg-chatt-dampad-5: #a9bdb5; --sg-chatt-dampad-6: #6f8a82; --sg-chatt-dampad-7: #8ea79e;
        --sg-chattgron-a10: rgba(143,194,168,0.1); --sg-chattgron-a12: rgba(143,194,168,0.12); --sg-chattgron-a15: rgba(143,194,168,0.15);
        --sg-chattgron-a20: rgba(143,194,168,0.2); --sg-chattgron-a25: rgba(143,194,168,0.25); --sg-chattgron-a30: rgba(143,194,168,0.3);
        --sg-chattgron-a40: rgba(143,194,168,0.4); --sg-chattgron-a50: rgba(143,194,168,0.5); --sg-chattgron-a60: rgba(143,194,168,0.6);
        --sg-vit-a02: rgba(255,255,255,0.02); --sg-vit-a03: rgba(255,255,255,0.03); --sg-vit-a04: rgba(255,255,255,0.04); --sg-vit-a05: rgba(255,255,255,0.05);
        --sg-vit-a06: rgba(255,255,255,0.06); --sg-vit-a07: rgba(255,255,255,0.07); --sg-vit-a08: rgba(255,255,255,0.08);
        --sg-vit-a10: rgba(255,255,255,0.1); --sg-vit-a12: rgba(255,255,255,0.12); --sg-vit-a13: rgba(255,255,255,0.13); --sg-vit-a15: rgba(255,255,255,0.15);

      }
      :root[data-theme="dark"] #root h1 em { color: #e3a58f; }

      @media print {
        :root[data-theme="dark"] { --n-bg: #ffffff; --sg-kort: #ffffff; --sg-text: #123f37; --sg-text-2: #123f37; --sg-text-dampad: #4f6b63; --sg-niva-andel: 100%; }

      .norvay-footer { padding: 0 0 8px; }
